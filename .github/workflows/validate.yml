name: Validate framework

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install --no-build-isolation -e '.[dev]'
      - name: Validate content
        run: python -m validator.validate
      - name: Check source freshness
        run: python -m validator source-freshness --fail-on-stale
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check validator tests
