name: Apply v0.4 release payload

on:
  push:
    branches: [main]
    paths:
      - '.v04-payload/**'
      - '.github/workflows/apply-v04.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply payload
        run: python .v04-payload/apply.py
      - name: Install and validate
        run: |
          python -m pip install --no-build-isolation -e '.[dev]'
          python -m ruff check validator tests --fix
          python -m validator.validate
          python -m validator source-freshness --fail-on-stale
          python -m pytest
          python -m ruff check validator tests
      - name: Commit v0.4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: release v0.4 adaptive retrieval framework'
          git push origin main
