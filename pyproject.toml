[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-certification-learning-framework"
version = "0.4.0"
description = "Agent-compatible AWS certification learning, adaptive quiz, retrieval, and validation tools"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "ruff>=0.5,<1",
]

[project.scripts]
aws-cert = "validator.cli:main"

[tool.setuptools]
packages = ["validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
